name: Update Shield Rules

on:
  schedule:
    - cron: '0 3 * * 1,4' # Twice a week at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Shield Rules Builder
        run: python builder/build.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rkn.txt vk.txt
          if git diff --staged --quiet; then
            echo "No changes in prefix lists"
          else
            git commit -m "chore(rules): update prefix lists $(date -u +'%Y-%m-%d')"
            git push
          fi
